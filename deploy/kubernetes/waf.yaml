apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  namespace: cybersec
spec:
  replicas: 2
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      containers:
      - name: waf
        image: cybersec/waf:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq:5672"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: waf
  namespace: cybersec
spec:
  ports:
  - port: 3001
    targetPort: 3001
  selector:
    app: waf
