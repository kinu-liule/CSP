# WAF Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  namespace: cybersec
spec:
  replicas: 2
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      containers:
      - name: waf
        image: ghcr.io/kinu-liule/csp/waf:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: cybersec-config
              key: RABBITMQ_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cybersec-secrets
              key: jwt-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: waf
  namespace: cybersec
spec:
  ports:
  - port: 3001
    targetPort: 3001
  selector:
    app: waf
---
