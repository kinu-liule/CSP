apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngfw
  namespace: cybersec
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ngfw
  template:
    metadata:
      labels:
        app: ngfw
    spec:
      containers:
      - name: ngfw
        image: cybersec/ngfw:latest
        ports:
        - containerPort: 3002
        env:
        - name: PORT
          value: "3002"
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq:5672"
---
