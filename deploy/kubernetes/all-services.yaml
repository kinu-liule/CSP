apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  namespace: cybersec
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iam
  template:
    metadata:
      labels:
        app: iam
    spec:
      containers:
      - name: iam
        image: cybersec/iam:latest
        ports:
        - containerPort: 3008
        env:
        - name: PORT
          value: "3008"
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq:5672"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cybersec-secrets
              key: jwt-secret
---
apiVersion: v1
kind: Namespace
metadata:
  name: cybersec
---
apiVersion: v1
kind: Secret
metadata:
  name: cybersec-secrets
  namespace: cybersec
type: Opaque
data:
  jwt-secret: eW91ci1zZWNyZXQta2V5LWNoYW5nZS1tZQ==
