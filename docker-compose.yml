services:
  # PostgreSQL Database
  postgres:
    platform: linux/amd64
    image: postgres:16-alpine
    container_name: cybersec-postgres
    environment:
          POSTGRES_DB: cybersec_platform
          POSTGRES_USER: cybersec
          POSTGRES_PASSWORD: securepassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersec"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cybersec-network

  # Redis for caching
  redis:
    platform: linux/amd64
    image: redis:7-alpine
    container_name: cybersec-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cybersec-network

  # RabbitMQ for message queuing
  rabbitmq:
    platform: linux/amd64
    image: rabbitmq:3-management-alpine
    container_name: cybersec-rabbitmq
    environment:
          RABBITMQ_DEFAULT_USER: cybersec
          RABBITMQ_DEFAULT_PASS: securepassword
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cybersec-network

  # API Gateway
  api-gateway:
    platform: linux/amd64
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: cybersec-api-gateway
    ports:
      - "3000:3000"
    environment:
          NODE_ENV: production
          PORT: 3000
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: cybersec_platform
          DB_USER: cybersec
          DB_PASSWORD: securepassword
          JWT_SECRET: super-secret-jwt-key-change-in-production
          USE_HTTPS: "false"
          REDIS_URL: redis://redis:6379
          RABBITMQ_URL: amqp://cybersec:securepassword@rabbitmq:5672
          # Original services
          IAM_SERVICE_URL: http://iam:3008
          WAF_SERVICE_URL: http://waf:3001
          NGFW_SERVICE_URL: http://ngfw:3002
          SIEM_SOAR_SERVICE_URL: http://siem-soar:3003
          VULN_SCANNER_SERVICE_URL: http://vuln-scanner:3004
          FRAUD_DETECTION_SERVICE_URL: http://fraud-detection:3005
          AWARENESS_SERVICE_URL: http://awareness:3006
          GRC_SERVICE_URL: http://grc:3007
          # New services - 12 total
          ASSET_MANAGEMENT_URL: http://asset-management:3009
          CSPM_SERVICE_URL: http://cspm:3011
          EDR_SERVICE_URL: http://edr:3015
          THREAT_INTEL_URL: http://threat-intel:3019
          SOAR_SERVICE_URL: http://soar:3018
          DATA_SECURITY_URL: http://data-security:3012
          DATA_LAKE_URL: http://data-lake:3017
          XDR_SERVICE_URL: http://xdr:3020
          DEVSECOPS_SERVICE_URL: http://devsecops:3014
          DECEPTION_SERVICE_URL: http://deception:3013
          PASSWORD_MANAGER_URL: http://password-manager:3016
          BUSINESS_CONTINUITY_URL: http://business-continuity:3010
          RISK_ENGINE_URL: http://risk-engine:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./api-gateway/logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - cybersec-network

  # IAM Service
  iam:
    platform: linux/amd64
    build:
      context: ./iam-service
      dockerfile: Dockerfile
    container_name: cybersec-iam
    ports:
      - "3008:3008"
    environment:
          NODE_ENV: production
          PORT: 3008
          DATABASE_URL: postgresql://cybersec:securepassword@postgres:5432/cybersec_platform
          JWT_SECRET: super-secret-jwt-key-change-in-production
          RABBITMQ_URL: amqp://cybersec:securepassword@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3008/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cybersec-network

  # WAF Service
