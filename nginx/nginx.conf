events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:80;
    }
    
    upstream api_gateway {
        server api-gateway:3000;
    }
    
    # Original services
    upstream vuln-scanner {
        server vuln-scanner:3004;
    }
    upstream waf {
        server waf:3001;
    }
    upstream ngfw {
        server ngfw:3002;
    }
    upstream siem-soar {
        server siem-soar:3003;
    }
    upstream fraud-detection {
        server fraud-detection:3005;
    }
    upstream grc {
        server grc:3007;
    }
    upstream risk-engine {
        server risk-engine:8000;
    }
    
    # New services - 12 total
    upstream asset-management {
        server asset-management:3009;
    }
    upstream cspm {
        server cspm:3011;
    }
    upstream edr {
        server edr:3015;
    }
    upstream threat-intel {
        server threat-intel:3019;
    }
    upstream soar {
        server soar:3018;
    }
    upstream data-security {
        server data-security:3012;
    }
    upstream data-lake {
        server data-lake:3017;
    }
    upstream xdr {
        server xdr:3020;
    }
    upstream devsecops {
        server devsecops:3014;
    }
    upstream deception {
        server deception:3013;
    }
    upstream password-manager {
        server password-manager:3016;
    }
    upstream business-continuity {
        server business-continuity:3010;
    }

    # ---- PUBLIC PORTAL (port 80) - redirects to unified org portal ----
    server {
        listen 80;
        server_name localhost;
        return 301 http://localhost:8081$request_uri;
    }

    # ---- ORGANIZATION ADMIN PORTAL (port 8081) ----
    server {
        listen 8081;
        server_name localhost;
        
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        location /api/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin "http://localhost:8081" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With,x-tenant-id,x-api-key" always;
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api-docs {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api-docs.json {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /health {
            proxy_pass http://api_gateway;
        }
        
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }
        
        location @fallback {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ---- SUPER ADMIN PORTAL (port 9090) ----
    server {
        listen 9090;
        server_name localhost;
        
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        location /api/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin "http://localhost:9090" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With,x-tenant-id,x-api-key" always;
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api-docs {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api-docs.json {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /health {
            proxy_pass http://api_gateway;
        }
        
        # EthioCyberGrid Admin Server
        location /services/ {
            proxy_pass http://awareness:3333/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            sub_filter_types *;
            sub_filter '/css/' '/services/css/';
            sub_filter '/js/' '/services/js/';
            sub_filter '/images/' '/services/images/';
            sub_filter '/favicon.svg' '/services/favicon.svg';
            sub_filter_once off;
            proxy_redirect / /services/;
        }
        location /services/css/ { proxy_pass http://awareness:3333/css/; proxy_set_header Host $host; }
        location /services/js/ { proxy_pass http://awareness:3333/js/; proxy_set_header Host $host; }
        location /services/images/ { proxy_pass http://awareness:3333/images/; proxy_set_header Host $host; }
        location /services/favicon.svg { proxy_pass http://awareness:3333/favicon.svg; proxy_set_header Host $host; }
        
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }
        
        location @fallback {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
