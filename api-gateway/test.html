<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>API Gateway Test Page</title>
  <style>
    body { font-family: monospace; background: #0a0e27; color: #00ff41; padding: 20px; }
    button { background: #00ff41; color: #0a0e27; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #00cc33; }
    pre { background: #1a1f3a; padding: 15px; border: 1px solid #00ff41; overflow: auto; max-height: 400px; }
    .section { margin-bottom: 30px; }
    h2 { color: #00ff41; border-bottom: 1px solid #00ff41; padding-bottom: 10px; }
  </style>
</head>
<body>
  <h1>API Gateway Platform - Test Page</h1>
  
  <div class="section">
    <h2>Health Check</h2>
    <button onclick="testEndpoint('/health', 'healthResult')">Test /health</button>
    <pre id="healthResult">Click button to test...</pre>
  </div>

  <div class="section">
    <h2>Dashboard</h2>
    <button onclick="window.open('/dashboard', '_blank')">Open Dashboard</button>
  </div>

  <div class="section">
    <h2>Tenants API</h2>
    <button onclick="testEndpoint('/api/tenants', 'tenantsResult')">GET /api/tenants</button>
    <pre id="tenantsResult">Click button to test...</pre>
  </div>

  <div class="section">
    <h2>Analytics Metrics</h2>
    <button onclick="testEndpoint('/api/analytics/metrics', 'metricsResult')">GET /api/analytics/metrics</button>
    <pre id="metricsResult">Click button to test...</pre>
  </div>

  <div class="section">
    <h2>Policies</h2>
    <button onclick="testEndpoint('/api/policies', 'policiesResult')">GET /api/policies</button>
    <pre id="policiesResult">Click button to test...</pre>
  </div>

  <div class="section">
    <h2>Services</h2>
    <button onclick="testEndpoint('/services', 'servicesResult')">GET /services</button>
    <pre id="servicesResult">Click button to test...</pre>
  </div>

  <script>
    async function testEndpoint(path, resultId) {
      const resultEl = document.getElementById(resultId);
      resultEl.textContent = 'Loading...';
      try {
        const response = await fetch(path);
        const data = await response.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
