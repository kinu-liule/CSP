name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-api-gateway:
    name: API Gateway - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-gateway/package-lock.json
      - run: npm ci
      - run: npm test -- --passWithNoTests

  lint-and-test-iam:
    name: IAM Service - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iam-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: iam-service/package-lock.json
      - run: npm ci
      - run: npx eslint . --ext .js --no-error-on-unmatched-pattern || true

  test-waf-service:
    name: WAF Service - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waf-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: waf-service/package-lock.json
      - run: npm ci
      - run: npx jest --passWithNoTests

  test-fraud-detection:
    name: Fraud Detection - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud-detection-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fraud-detection-service/package-lock.json
      - run: npm ci
      - run: npx jest --passWithNoTests || true

  build-frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 3

  docker-compose-build:
    name: Docker Compose - Build
    runs-on: ubuntu-latest
    needs: [lint-and-test-api-gateway, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - run: sleep 15
      - name: Health Checks
        run: |
          services=("postgres" "redis" "rabbitmq" "api-gateway" "iam" "waf" "ngfw" "siem-soar" "vuln-scanner" "fraud-detection" "awareness" "grc" "risk-engine" "asset-management" "cspm" "edr" "threat-intel" "soar" "data-security" "data-lake" "xdr" "devsecops" "deception" "password-manager" "business-continuity" "frontend")
          for svc in "${services[@]}"; do
            container="cybersec-${svc}"
            if docker ps --format '{{.Names}}' | grep -q "$container"; then
              echo "✅ $container is running"
            else
              echo "❌ $container is NOT running"
              docker compose logs "$svc" --tail=20
              exit 1
            fi
          done
          echo "All services are running"
      - run: docker compose down
