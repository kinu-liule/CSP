name: Docker Build & Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated, or "all")'
        required: true
        default: all

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  docker-build-all:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine services to build
        id: services
        run: |
          if [ "${{ github.event.inputs.services }}" = "all" ] || [ -z "${{ github.event.inputs.services }}" ]; then
            echo "matrix={\"service\":[\"api-gateway\",\"iam\",\"waf\",\"ngfw\",\"siem-soar\",\"vuln-scanner\",\"fraud-detection\",\"grc\",\"risk-engine\",\"asset-management\",\"cspm\",\"edr\",\"threat-intel\",\"soar\",\"data-security\",\"data-lake\",\"xdr\",\"devsecops\",\"deception\",\"password-manager\",\"business-continuity\",\"frontend\"]}" >> $GITHUB_OUTPUT
          else
            list=$(echo "${{ github.event.inputs.services }}" | tr ',' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "matrix={\"service\":$list}" >> $GITHUB_OUTPUT
          fi

    outputs:
      matrix: ${{ steps.services.outputs.matrix }}

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: docker-build-all
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.docker-build-all.outputs.matrix).service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine context and dockerfile
        id: config
        run: |
          svc="${{ matrix.service }}"
          case "$svc" in
            api-gateway)          ctx="api-gateway";;
            iam)                  ctx="iam-service";;
            waf)                  ctx="waf-service";;
            ngfw)                 ctx="ngfw-service";;
            siem-soar)            ctx="siem-soar-service";;
            vuln-scanner)         ctx="vuln-scanner-service";;
            fraud-detection)      ctx="fraud-detection-service";;
            awareness)            ctx="awareness-service";;
            grc)                  ctx="grc-service";;
            risk-engine)          ctx="risk-engine";;
            asset-management)     ctx="asset-management-service";;
            cspm)                 ctx="cspm-service";;
            edr)                  ctx="edr-service";;
            threat-intel)         ctx="threat-intel-service";;
            soar)                 ctx="soar-service";;
            data-security)        ctx="data-security-service";;
            data-lake)            ctx="security-data-lake-service";;
            xdr)                  ctx="xdr-service";;
            devsecops)            ctx="devsecops-service";;
            deception)            ctx="deception-service";;
            password-manager)     ctx="password-manager-service";;
            business-continuity)  ctx="business-continuity-service";;
            frontend)             ctx="frontend";;
            *)                    ctx="$svc";;
          esac
          echo "context=$ctx" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ steps.config.outputs.context }}
          file: ./${{ steps.config.outputs.context }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
